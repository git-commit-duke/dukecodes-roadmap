<style>/* Mission Control design tokens — canonical copy lives in git-commit-duke/dukecodes-project-template.
   Every dukecodes repo and site uses these. Change here, then sync downstream. */
:root{
  --bg:#eceae4; --bg2:#e2dfd7; --panel:#f7f6f2; --panel2:#efede7;
  --ink:#1d1f22; --ink2:#4a4e55; --ink3:#6b7078;
  --line:#cfcbc1; --line2:#bdb8ac;
  --amber:#b05e00; --amber-soft:#f6dfc0; --teal:#00796e; --teal-soft:#c9ebe6;
  --red:#b3261e; --red-soft:#f6d5d2; --green:#2f7d32; --green-soft:#d6ecd4; --violet:#6a4bb5; --violet-soft:#e3dbf6;
  --code-bg:#1b1d21; --code-ink:#e8e6df;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(0,0,0,.06),0 6px 20px -12px rgba(0,0,0,.25);
  --grid:rgba(0,0,0,.045);
  /* node / domain colors */
  --c-ops:#c76a00; --c-media:#7b3fb8; --c-dev:#00796e; --c-core:#1f62c4; --c-sec:#b8325a; --c-net:#4a4e55;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif;
  --font-b:'IBM Plex Sans',system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px; --radius-s:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --bg2:#0d0f11; --panel:#1a1d21; --panel2:#20242a;
  --ink:#ecebe6; --ink2:#b4b6ba; --ink3:#8d9198;
  --line:#2c3138; --line2:#3a4049;
  --amber:#ffa53d; --amber-soft:#3a2810; --teal:#3fd1bf; --teal-soft:#0f312d;
  --red:#ff6b5e; --red-soft:#3b1714; --green:#6fcf73; --green-soft:#16301a; --violet:#b39cff; --violet-soft:#271f40;
  --code-bg:#0b0c0e; --code-ink:#e8e6df;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -18px rgba(0,0,0,.8);
  --grid:rgba(255,255,255,.035);
  --c-ops:#ffa53d; --c-media:#c08cff; --c-dev:#3fd1bf; --c-core:#6aa8ff; --c-sec:#ff7a9c; --c-net:#9aa0a8;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121417; --bg2:#0d0f11; --panel:#1a1d21; --panel2:#20242a;
  --ink:#ecebe6; --ink2:#b4b6ba; --ink3:#8d9198;
  --line:#2c3138; --line2:#3a4049;
  --amber:#ffa53d; --amber-soft:#3a2810; --teal:#3fd1bf; --teal-soft:#0f312d;
  --red:#ff6b5e; --red-soft:#3b1714; --green:#6fcf73; --green-soft:#16301a; --violet:#b39cff; --violet-soft:#271f40;
  --code-bg:#0b0c0e; --code-ink:#e8e6df;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -18px rgba(0,0,0,.8);
  --grid:rgba(255,255,255,.035);
  --c-ops:#ffa53d; --c-media:#c08cff; --c-dev:#3fd1bf; --c-core:#6aa8ff; --c-sec:#ff7a9c; --c-net:#9aa0a8;
  color-scheme:dark;}
/* Mission Control components. Needs mc-tokens.css first. Class names are the shared API: don't rename. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-b);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
a{color:var(--teal)} button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-d);letter-spacing:-.015em;margin:0}
.mono{font-family:var(--font-m)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* top bar + brand */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-m);font-weight:700;font-size:13px;letter-spacing:.06em;white-space:nowrap;color:var(--ink);text-decoration:none}
.brand .rack{width:22px;height:22px;border:2px solid var(--ink);border-radius:4px;display:grid;grid-template-rows:repeat(3,1fr);gap:2px;padding:2px}
.brand .rack i{background:var(--amber);border-radius:1px}.brand .rack i:nth-child(2){background:var(--teal)}.brand .rack i:nth-child(3){background:var(--ink3)}
.brand b{color:var(--amber)}
.nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.nav a,.nav button{background:none;border:0;padding:7px 11px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap;text-decoration:none}
.nav [aria-current="true"],.nav [aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.sp{flex:1}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}

/* surfaces */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:30px 0 12px}
.sec-h h2{font-size:22px} .sec-h p{margin:0;color:var(--ink3);font-size:13.5px}

/* chips: labels and risk badges */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-m);font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;background:var(--panel)}
.chip.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chip.teal{background:var(--teal-soft);border-color:transparent;color:var(--teal)}
.chip.red{background:var(--red-soft);border-color:transparent;color:var(--red)}
.chip.green{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.violet{background:var(--violet-soft);border-color:transparent;color:var(--violet)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:var(--radius-s);padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.amber{background:var(--amber);color:#fff;border-color:var(--amber)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:22px}
.hero-l{padding:26px 26px 22px}
.hero-l h1{font-size:clamp(30px,4.2vw,50px);line-height:1.02;font-weight:800}
.hero-l h1 em{font-style:normal;color:var(--amber)}
.lede{color:var(--ink2);max-width:62ch;margin:12px 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.stat b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--ink3)}
.next{padding:20px;display:flex;flex-direction:column;gap:12px}
.next .nt{font-family:var(--font-d);font-size:21px;line-height:1.2}

/* pipeline (stages) */
.swarm{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.agent{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 11px 11px;overflow:hidden;text-align:left;cursor:pointer}
.agent .an{font-family:var(--font-m);font-size:10.5px;color:var(--ink3);display:flex;justify-content:space-between}
.agent .at{font-weight:600;font-size:13px;line-height:1.25;margin:4px 0 8px;min-height:2.5em}
.bar{height:5px;border-radius:9px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--teal);border-radius:9px;transition:width .5s}
.agent .st{font-family:var(--font-m);font-size:10px;margin-top:6px;color:var(--ink3)}
.agent.done .bar i{background:var(--green)} .agent.done .st{color:var(--green)}
.agent.active{border-color:var(--amber)} .agent.active .bar i{background:var(--amber)} .agent.active .st{color:var(--amber)}
.agent.active::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--amber) 14%,transparent) 50%,transparent 70%);background-size:250% 100%;animation:scan 2.4s linear infinite;pointer-events:none}
@keyframes scan{from{background-position:150% 0}to{background-position:-100% 0}}

/* runbook step: Why / Do / Check / Undo */
.step{margin-bottom:8px;overflow:hidden}
.step.done{opacity:.72}
.sh{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer}
.ck{appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--line2);border-radius:6px;margin:1px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--panel)}
.ck:checked{background:var(--green);border-color:var(--green)}
.ck:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sh .ti{flex:1;min-width:0}
.sh .sid{font-family:var(--font-m);font-size:11px;color:var(--ink3)}
.sh .stt{font-weight:600;font-size:15px;line-height:1.3;margin:1px 0 6px}
.step.done .stt{text-decoration:line-through;text-decoration-color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.car{flex:none;color:var(--ink3);transition:transform .2s;margin-top:2px}
.step.open .car{transform:rotate(90deg)}
.sb{display:none;padding:0 16px 16px 48px;border-top:1px dashed var(--line)}
.step.open .sb{display:block}
.sb h4{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:16px 0 6px;font-weight:500}
.sb p{margin:0 0 6px}

/* code block with copy button */
.cmd{position:relative;margin:6px 0 2px;background:var(--code-bg);color:var(--code-ink);border-radius:var(--radius-s);font:12.5px/1.55 var(--font-m);padding:11px 52px 11px 12px;white-space:pre-wrap;word-break:break-word;overflow:auto}
.cmd .cp{position:absolute;top:6px;right:6px;background:#2b2f35;border:1px solid #3a3f46;color:#cfd2d6;border-radius:6px;font:11px var(--font-m);padding:3px 7px;cursor:pointer}
.cmd .cp.ok{background:var(--green);color:#fff;border-color:var(--green)}

/* callouts */
.callout{border-radius:10px;padding:10px 12px;margin:12px 0 0;font-size:13.5px}
.callout.warn{background:var(--red-soft)} .callout.warn b{color:var(--red)}
.callout.gate{background:var(--amber-soft)} .callout.gate b{color:var(--amber)}
.callout.tip{background:var(--teal-soft)} .callout.tip b{color:var(--teal)}
.callout.unv{background:var(--violet-soft)} .callout.unv b{color:var(--violet)}

/* cards, tables, glossary */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{padding:16px;color:inherit;text-decoration:none;display:block}
.card h3{font-size:18px} .card .sub{font-family:var(--font-m);font-size:11.5px;color:var(--ink3);margin-top:2px}
.card p{margin:8px 0 0;font-size:14px;color:var(--ink2)}
.card ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink2)}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.gloss{columns:2 320px;column-gap:24px}
.gloss div{break-inside:avoid;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.gloss b{font-family:var(--font-m);font-size:12.5px;color:var(--teal);margin-right:6px}
abbr.g{text-decoration:underline dotted var(--ink3);text-underline-offset:3px;cursor:help}
.foot{margin-top:40px;color:var(--ink3);font-size:12.5px;font-family:var(--font-m)}

@media (max-width:960px){.hero{grid-template-columns:1fr}}
@media (max-width:640px){.top .wrap{flex-wrap:wrap;row-gap:6px}.nav{order:9;width:100%;margin-left:0}.stats{grid-template-columns:repeat(2,1fr)}.sb{padding-left:16px}.hero-l{padding:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- interactive layer ---------- */
.ring{width:34px;height:34px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:11px;color:var(--red);letter-spacing:.08em}
.live .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

/* gate simulator */
.sim{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
.sim-l{padding:12px;display:flex;flex-direction:column;gap:4px}
.scn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:var(--radius-s);padding:8px 9px;cursor:pointer}
.scn:hover{background:var(--panel2)}
.scn[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.scn .pl{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:13px;flex:none}
.scn small{display:block;color:var(--ink3);font-size:12px;line-height:1.3}
.sim-r{padding:14px;overflow:hidden}
.lane{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;padding-top:30px}
.track{position:absolute;left:4%;right:4%;top:12px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 6px,transparent 6px 12px)}
.pkt{position:absolute;top:5px;left:0;width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 25%,transparent),0 0 14px var(--amber);transform:translateX(-50%);transition:left .55s cubic-bezier(.5,0,.2,1),background .2s;opacity:0}
.pkt.on{opacity:1}.pkt.bad{background:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 25%,transparent),0 0 16px var(--red)}
.pkt.ok{background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 25%,transparent),0 0 16px var(--green)}
.gate{position:relative;border:1px solid var(--line);border-radius:10px;padding:9px 9px 10px;background:var(--panel);overflow:hidden;min-height:96px;transition:border-color .2s,transform .2s}
.gate .gw{text-decoration:none;font-family:var(--font-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.gate .gn{font-weight:600;font-size:13px;line-height:1.2;margin:3px 0 7px}
.gate .gs{font-family:var(--font-m);font-size:10.5px;color:var(--ink3);margin-top:6px}
.gate.scan{border-color:var(--amber)}
.gate.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--amber) 16%,transparent) 50%,transparent 70%);background-size:250% 100%;animation:scan 1.2s linear infinite;pointer-events:none}
.gate.scan .bar i{background:var(--amber)} .gate.scan .gs{color:var(--amber)}
.gate.pass{border-color:color-mix(in srgb,var(--green) 55%,var(--line))} .gate.pass .bar i{background:var(--green)} .gate.pass .gs{color:var(--green)}
.gate.block{border-color:var(--red);background:var(--red-soft);animation:shake .4s} .gate.block .bar i{background:var(--red)} .gate.block .gs{color:var(--red)}
.gate.skip{opacity:.4}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.zone{display:flex;gap:8px;margin-top:8px;font-family:var(--font-m);font-size:10.5px;color:var(--ink3)}
.zone span{flex:var(--w);border-top:2px solid var(--line2);padding-top:4px;text-align:center}
.log{margin-top:12px;background:var(--code-bg);color:var(--code-ink);border-radius:var(--radius-s);font:12px/1.6 var(--font-m);padding:10px 12px;min-height:118px;max-height:200px;overflow:auto}
.log .ok{color:#6fcf73}.log .bad{color:#ff6b5e}.log .dim{color:#8d9198}.log .warn{color:#ffa53d}
.verdict{margin-top:10px}
.sim-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-family:var(--font-m);font-size:11.5px;color:var(--ink3)}
.sim-stats b{color:var(--ink);font-size:13px}

/* terminal replay */
.run{position:absolute;top:6px;right:52px;background:#2b2f35;border:1px solid #3a3f46;color:#cfd2d6;border-radius:6px;font:11px var(--font-m);padding:3px 7px;cursor:pointer}
.term{margin:4px 0 0;background:var(--code-bg);color:var(--code-ink);border-radius:var(--radius-s);font:12px/1.55 var(--font-m);padding:10px 12px;white-space:pre-wrap;min-height:2.2em}
.term .pr{color:#3fd1bf}.term .cur::after{content:"▍";color:#ffa53d;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* glossary tooltip, palette, toast, quiz */
#tip{position:fixed;z-index:80;max-width:300px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.45;padding:9px 11px;border-radius:9px;pointer-events:none;opacity:0;transition:opacity .12s}
#tip b{font-family:var(--font-m);font-size:11.5px;color:var(--amber);display:block;margin-bottom:2px}
.kbtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink3);font-size:13px;white-space:nowrap}
.kbtn kbd{font-family:var(--font-m);font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:0 4px}
#pal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
#pal.on{display:flex}
#pal .box{width:min(600px,100%);max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
#pal input{border:0;border-bottom:1px solid var(--line);font:inherit;font-size:16px;padding:15px 16px;background:transparent;color:var(--ink);outline:none}
#pal .res{overflow:auto;padding:6px}
#pal .r{display:flex;gap:10px;align-items:baseline;padding:9px 10px;border-radius:8px;cursor:pointer}
#pal .r.on,#pal .r:hover{background:var(--panel2)}
#pal .r .k{font-family:var(--font-m);font-size:11px;color:var(--ink3);width:62px;flex:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:95;transition:transform .25s}
.toast.on{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:96}

.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2)}

.quiz{padding:18px;display:grid;gap:12px;justify-items:center;text-align:center}
.flip{width:min(460px,100%);height:180px;perspective:900px;cursor:pointer;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;display:grid;place-items:center;padding:18px;border-radius:var(--radius);border:1px solid var(--line2);backface-visibility:hidden;background:var(--panel2)}

@media (max-width:960px){.sim{grid-template-columns:1fr}.sim-l{flex-direction:row;overflow-x:auto}.scn{flex:none;width:auto}.scn small{display:none}}
@media (max-width:640px){.lane{grid-template-columns:1fr 1fr;padding-top:8px}.track,.pkt{display:none}.zone{display:none}.kbtn span{display:none}}

/* ---------- premium layer: hero, console, bento, path, reveal ---------- */
.aura{position:fixed;inset:-20vh -10vw auto;height:90vh;z-index:-1;pointer-events:none;filter:blur(70px);opacity:.55}
.aura i{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.aura i:nth-child(1){width:42vw;height:42vw;left:4vw;top:6vh;background:color-mix(in srgb,var(--amber) 35%,transparent)}
.aura i:nth-child(2){width:36vw;height:36vw;right:2vw;top:0;background:color-mix(in srgb,var(--teal) 30%,transparent);animation-delay:-6s}
.aura i:nth-child(3){width:28vw;height:28vw;left:38vw;top:28vh;background:color-mix(in srgb,var(--violet) 22%,transparent);animation-delay:-12s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.12)}}
body{position:relative;isolation:isolate}

.hero2{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding:64px 0 26px}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:11.5px;letter-spacing:.06em;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--ink2)}
.badge b{background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 8px;font-weight:600}
.hero2 h1{font-size:clamp(40px,6vw,74px);line-height:.98;font-weight:800;letter-spacing:-.035em;margin-top:18px}
.hero2 h1 em{font-style:normal;background:linear-gradient(92deg,var(--amber),color-mix(in srgb,var(--amber) 55%,var(--red)) 60%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero2 .lede{font-size:17px;max-width:54ch;margin:18px 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn.lg{padding:12px 18px;font-size:15px;border-radius:12px}
.btn.glow{background:var(--amber);border-color:var(--amber);color:#1d1f22;font-weight:600;box-shadow:0 8px 28px -8px color-mix(in srgb,var(--amber) 70%,transparent),0 0 0 1px color-mix(in srgb,#fff 18%,transparent) inset;transition:transform .15s,box-shadow .15s}
.btn.glow:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px color-mix(in srgb,var(--amber) 85%,transparent)}
.btn.ghost{background:color-mix(in srgb,var(--panel) 70%,transparent);backdrop-filter:blur(6px)}
.proof{display:flex;flex-wrap:wrap;gap:18px;margin-top:26px;font-family:var(--font-m);font-size:12px;color:var(--ink3)}
.proof b{color:var(--ink);font-size:15px;font-family:var(--font-d);margin-right:4px}

.console{border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb,var(--line2) 70%,transparent);background:#0f1114;box-shadow:0 40px 80px -30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;transform:perspective(1400px) rotateY(-7deg) rotateX(3deg);transition:transform .5s}
.console:hover{transform:perspective(1400px) rotateY(0) rotateX(0)}
.console .chrome{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid #22262c;background:#15181c}
.console .chrome i{width:11px;height:11px;border-radius:50%;background:#3a3f46}
.console .chrome i:nth-child(1){background:#ff5f57}.console .chrome i:nth-child(2){background:#febc2e}.console .chrome i:nth-child(3){background:#28c840}
.console .chrome span{margin-left:10px;font:12px var(--font-m);color:#8d9198}
.console .chrome .live{margin-left:auto}
.console .body{font:13px/1.75 var(--font-m);color:#e8e6df;padding:16px 18px;height:300px;overflow:hidden}
.console .row{display:flex;gap:10px;align-items:center;animation:rowIn .25s ease-out}
.console .row .ic{width:16px;text-align:center}
.console .row .nm{width:160px;color:#e8e6df}
.console .row .ds{color:#8d9198}
.console .ok{color:#6fcf73}.console .bad{color:#ff6b5e}.console .run{color:#ffa53d;position:static;background:none;border:0;padding:0}
.console .spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}}
.console .foot2{display:flex;justify-content:space-between;padding:10px 18px;border-top:1px solid #22262c;font:11.5px var(--font-m);color:#8d9198;background:#121417}

.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.tile{grid-column:span 2;padding:20px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.tile.wide{grid-column:span 3}
.tile:hover{transform:translateY(-3px);border-color:var(--line2)}
.tile::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--amber) 60%,transparent),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .2s;pointer-events:none}
.tile:hover::before{opacity:1}
.tile .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--amber);margin-bottom:14px}
.tile h3{font-size:18px}.tile p{margin:6px 0 0;color:var(--ink2);font-size:14px}

.path{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px;position:relative}
.path::before{content:"";position:absolute;left:6%;right:6%;top:19px;height:2px;background:linear-gradient(90deg,var(--amber),var(--teal),var(--violet));opacity:.6}
.pnode{position:relative;text-align:center;padding:0 6px}
.pnode .n{width:40px;height:40px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--amber);font:700 13px var(--font-m);position:relative;z-index:1;box-shadow:0 0 0 6px var(--bg)}
.pnode:nth-child(2) .n{border-color:var(--teal)}.pnode:nth-child(3) .n{border-color:var(--violet)}.pnode:nth-child(4) .n{border-color:var(--green)}
.pnode .w{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.pnode h3{font-size:17px;margin:4px 0}.pnode p{margin:0;font-size:13.5px;color:var(--ink2)}

.continue{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:14px 18px;margin-bottom:12px}
.continue .nt{font-family:var(--font-d);font-size:18px;font-weight:700}
.continue p{margin:0;color:var(--ink2);font-size:14px;flex:1 1 280px}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
.big-h{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.025em;line-height:1.05}
.kicker{display:block;margin-bottom:8px}
.sec2{margin-top:72px}
.sec2 > .head{max-width:720px;margin-bottom:22px}
.sec2 > .head p{color:var(--ink2);margin:10px 0 0;font-size:16px}
.final{margin-top:72px;padding:40px 28px;text-align:center;position:relative;overflow:hidden}
.final h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.03em}
.final p{color:var(--ink2);max-width:56ch;margin:12px auto 22px}
.final .cta{justify-content:center}

@media (max-width:960px){.hero2{grid-template-columns:1fr;padding-top:36px}.console{transform:none}.bento{grid-template-columns:1fr 1fr}.tile,.tile.wide{grid-column:span 1}}
@media (max-width:640px){.bento{grid-template-columns:1fr}.path{grid-template-columns:1fr;gap:18px}.path::before{left:19px;right:auto;top:6%;bottom:6%;width:2px;height:auto}.pnode{text-align:left;display:grid;grid-template-columns:40px 1fr;gap:0 14px}.pnode .n{margin:0;grid-row:span 3}.console .row .nm{width:120px}.console .body{height:280px;font-size:12px}}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.aura{display:none}.console{transform:none}}
.console .row .ds{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.console .row .nm{flex:none;white-space:nowrap}
.console .row.cmdrow .nm{width:auto;color:#3fd1bf}
@media (max-width:640px){.console .row .nm{width:118px;overflow:hidden;text-overflow:ellipsis}.console .row .ds{font-size:11px}}
/* Roadmap-only styles, loaded after the shared Mission Control files in site/assets.
   Shared class names are the API: extend them here with rm- classes, don't restyle them. */

/* safe areas: side gutters, sticky header, the band above it */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
[hidden]{display:none!important}
.rm-lock{overflow:hidden}

/* header extras */
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--amber);transition:stroke-dasharray .8s ease}
.ring text{fill:var(--ink);font-family:var(--font-m);font-weight:700}
.rm-present-btn{white-space:nowrap;flex:none}
.rm-skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;text-decoration:none}
.rm-skip:focus{left:max(16px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px))}
.rm-noscript{margin-top:24px;padding:18px}
.rm-agent{text-decoration:none;color:inherit}
a.chip{text-decoration:none}
main:focus{outline:none}
.rm-gap-top{margin-top:14px}
.rm-gap-bottom{margin-bottom:14px}
.rm-flash{animation:rmFlash 1.8s ease-out}
@keyframes rmFlash{from{background:var(--amber-soft)}}

/* view headings and toolbars */
.rm-vh{margin:30px 0 16px;max-width:780px}
.rm-vh h1{font-size:clamp(30px,4.4vw,46px);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin-top:6px}
.rm-vh p{color:var(--ink2);margin:10px 0 0;font-size:16px}
.rm-vh h1:focus{outline:none}
.rm-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.rm-input{font:inherit;font-size:15px;padding:8px 12px;border-radius:var(--radius-s);border:1px solid var(--line2);background:var(--panel);color:var(--ink);width:min(340px,100%)}
.rm-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:0 0 14px}
.rm-legend b{font-family:var(--font-m);color:var(--ink)}
.rm-muted{color:var(--ink3)}
.rm-small{font-size:13px}
.rm-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.rm-grid2 > *{min-width:0}

/* empty states */
.rm-empty{padding:24px 22px;display:grid;gap:10px;justify-items:start}
.rm-empty h3{font-size:19px}
.rm-empty p{margin:0;color:var(--ink2);max-width:66ch}
.rm-example{width:100%}
.rm-example .cmd{padding-right:12px}

/* overview */
.rm-hero-l{min-width:0}
.rm-hero-r{min-width:0}
.rm-badge-live .dot{animation:pulse 1.4s ease-in-out infinite;color:var(--red)}
.console .row.rm-gap{margin-top:6px}
.console .chrome .live{color:#ff6b5e}
.rm-node{border-top:3px solid var(--role,var(--line2))}
.rm-node .sub{display:flex;align-items:center;gap:6px}
.rm-node .sub .dot{color:var(--role,var(--ink3))}
.rm-net{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rm-start{display:flex;flex-direction:column;gap:6px}
.rm-start .rm-go{margin-top:auto;padding-top:10px;font-weight:600;color:var(--teal)}
.rm-sim-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:10px;font-family:var(--font-m);font-size:11px;color:var(--ink3)}

/* roadmap: phases and milestone cards */
.rm-phase{margin-top:34px}
.rm-phase-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px}
.rm-phase-h h2{font-size:24px}
.rm-mcard{display:flex;flex-direction:column;gap:9px;transition:transform .2s,border-color .2s}
.rm-mcard:hover{transform:translateY(-2px);border-color:var(--line2)}
.rm-mcard.st-done{border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
.rm-mcard.st-active,.rm-mcard.st-next{border-color:var(--amber)}
.rm-mcard h3{font-size:19px}
.rm-mcard p{margin:0}
.rm-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.rm-row .sp{min-width:8px}
.rm-meta{font-family:var(--font-m);font-size:11.5px;color:var(--ink3)}

/* milestone page */
.rm-crumb{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 10px;font-family:var(--font-m);font-size:12px;color:var(--ink3)}
.rm-crumb a{color:var(--ink2)}
.rm-mhead{padding:22px 22px 20px}
.rm-mhead h1{font-size:clamp(30px,4.4vw,46px);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:6px 0 10px}
.rm-mhead h1:focus{outline:none}
.rm-ms{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start;margin-top:18px}
.rm-ms > *{min-width:0}
.rm-aside{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));display:grid;gap:12px}
.rm-aside .card h3{font-size:15px;font-family:var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.rm-aside .card p{color:var(--ink)}
.rm-sec{margin-top:26px}
.rm-sec > h2{font-size:21px;margin-bottom:10px}
.rm-sec > p{margin:0 0 10px;color:var(--ink2)}
.rm-prose{padding:16px 18px}
.rm-prose p{margin:0}
.rm-sh{width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit}
.rm-sh .sid,.rm-sh .stt{display:block}
.rm-sh .chips{display:flex}
.rm-sh .car{display:grid}
.card .rm-list{padding-left:0;margin-top:6px}
.card .rm-list > li{padding:9px 0}
.rm-tick{flex:none;width:22px;height:22px;border:2px solid var(--line2);border-radius:6px;margin-top:1px;display:grid;place-items:center;background:var(--panel)}
.rm-tick.on{background:var(--green);border-color:var(--green)}
.rm-tick.on::after{content:"";width:6px;height:11px;border:solid var(--panel);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rm-list{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.rm-list > li{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line)}
.rm-list > li:last-child{border-bottom:0}
.rm-list .rm-ico{flex:none;color:var(--red);margin-top:2px}
.rm-list .rm-ico.teal{color:var(--teal)}
.rm-list .rm-ico.green{color:var(--green)}
.rm-list > li > div{min-width:0;flex:1}
.rm-list p{margin:0}
.rm-concept code{font-size:12px;color:var(--ink3)}
.rm-concept .rm-row{margin-top:6px}
.rm-proofs{margin:0;padding-left:18px}
.rm-proofs li{margin:4px 0}
.rm-pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px}

/* evidence, skills, certs */
.rm-claim{min-width:220px}
.rm-nowrap{white-space:nowrap}
.rm-domain{padding:16px}
.rm-domain .rm-row{justify-content:space-between}
.rm-domain h3{font-size:17px}
.rm-domain .bar{margin:10px 0 6px}
.rm-domain ul{list-style:none;margin:8px 0 0;padding:0;display:grid}
.rm-domain li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.rm-domain li > span:first-child{flex:1;min-width:0}
.rm-dots{display:inline-flex;gap:4px;flex:none}
.rm-dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2)}
.rm-dots i.on{background:var(--teal);border-color:var(--teal)}
.rm-score{font-family:var(--font-m);font-size:11px;color:var(--ink3);width:16px;text-align:right;flex:none}
.rm-total{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline;padding:16px 18px;margin-bottom:14px}
.rm-total b{font-family:var(--font-d);font-size:26px;display:block;line-height:1.1}
.rm-total span{font-size:12.5px;color:var(--ink3)}
.rm-total p{margin:0;flex:1 1 280px;color:var(--ink2);font-size:13.5px}

/* concept drill */

.flip.rm-qflip{height:230px;width:min(620px,100%)}
.rm-qflip .f{font-family:var(--font-d);font-size:clamp(17px,2.2vw,21px);font-weight:600;line-height:1.3}
.rm-qflip .b{font-size:14.5px;line-height:1.5;overflow:auto;align-content:center}
.rm-qflip .rm-side{position:absolute;top:10px;left:12px;font-family:var(--font-m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.rm-back{display:grid;gap:8px;text-align:left}
.rm-timer{font-family:var(--font-m);font-size:30px;font-weight:700;letter-spacing:.04em;line-height:1}
.rm-timer.low{color:var(--red)}
.rm-drill .chips{justify-content:center}

/* walkthrough deck */
.rm-deck{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.rm-deck-top{display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.rm-deck-prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.rm-deck-prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
.rm-stage{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding-block:18px}
.rm-stage:focus{outline:none}
.rm-slide{width:min(1040px,100%);display:grid;gap:18px;animation:rmIn .35s ease-out}
.rm-slide > *{min-width:0}
.rm-slide h2{font-size:clamp(30px,4.6vw,56px);line-height:1.02;letter-spacing:-.035em;font-weight:800}
.rm-slide h2 em{font-style:normal;background:linear-gradient(92deg,var(--amber),color-mix(in srgb,var(--amber) 55%,var(--red)) 60%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.rm-slide .lede{margin:0;font-size:18px}
.rm-slide .bento{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.rm-slide .tile,.rm-slide .tile.wide{grid-column:auto}
.rm-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:6px 18px;margin:0;padding:0;list-style:none;font-family:var(--font-m);font-size:13px}
.rm-checks li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.rm-checks li b{color:var(--green)}
.rm-checks li span{color:var(--ink2)}
.rm-deck-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.rm-count{color:var(--ink3);font-size:12px}

where."]],"why":[["t","Most breaches use valid credentials. Access based on identity (which person, on which device, to which port) beats access based on network location. Secrets are credentials at rest: if one exists in plaintext anywhere it can be copied, it will eventually leak."]],"story":[["t","\"How do you manage access and secrets?\" Access policy as code with tests, so a too-wide grant fails review; secrets encrypted in git, inventoried, and one rotated end to end as proof the process works."]],"reps":[{"id":"M4-R1","text":[["t","Put the tailnet policy in git so it matches the live policy (after you decide the three pending changes)"]],"doneWhen":[["t","the file in git and the live policy are identical"]],"done":false,"proofs":[]},{"id":"M4-R2","text":[["t","Add tests to the policy: cases that must be allowed and cases that must be denied"]],"doneWhen":[["t","widening a grant makes a test fail"]],"done":false,"proofs":[]},{"id":"M4-R3","text":[["t","Run the policy through CI: test on pull requests, apply on main, using an OAuth client scoped to the policy only and stored as a GitHub secret"]],"doneWhen":[["t","a merged pull request shows up in Tailscale's configuration log"]],"done":false,"proofs":[]},{"id":"M4-R4","text":[["t","Encrypt one real secret file with SOPS and age"]],"doneWhen":[["t","git holds only ciphertext and your age key is backed up offline"]],"done":false,"proofs":[]},{"id":"M4-R5","text":[["t","Write a secrets inventory with names only, never values"]],"doneWhen":[["t","each secret lists where it lives, who can read it and how to rotate it"]],"done":false,"proofs":[]},{"id":"M4-R6","text":[["t","Rotate one secret end to end"]],"doneWhen":[["t","the old value is revoked and proven dead"]],"done":false,"proofs":[]}],"breakIt":[[["t","From a device the policy should not allow, try to reach a node. It must be refused."]],[["t","Scan the full history of every repo with gitleaks. Zero findings, or you rotate what it finds."]]],"concepts":[{"slug":"authn-vs-authz","q":[["t","Identity, authentication and authorization: where does Tailscale do each?"]],"status":"todo","url":""},{"slug":"wireguard-and-tailscale","q":[["t","What does a WireGuard key pair prove, and what does the coordination server know?"]],"status":"todo","url":""},{"slug":"envelope-encryption","q":[["t","How does SOPS encrypt a file with age, and what happens if you lose the key?"]],"status":"todo","url":""}],"exit":[{"text":[["t","Policy in git with allow and deny tests, applied through CI"]],"done":false},{"text":[["t","At least one secret encrypted with SOPS and age, key backed up offline"]],"done":false},{"text":[["t","Secrets inventory merged and one secret rotated"]],"done":false},{"text":[["t","Three concept explainers written and reviewed"]],"done":false},{"text":[["t","A ledger row for every proof"]],"done":false}],"progress":[0,11],"proofs":[]},{"id":"M5","num":5,"title":"Detection","status":"queued","phase":3,"url":"https://github.com/git-commit-duke/dukecodes-roadmap/blob/main/milestones/m5-detection.md","build":[["t","Mission Control → Monitoring \u0026 power · Phase 2: OPNsense router + VLANs"]],"chapters":["Monitoring \u0026 power","Phase 2: OPNsense router + VLANs"],"proof":[["t","A Suricata alert for your own M1 scan, visible in Grafana, a custom detection you triggered on purpose, and an incident write-up"]],"cert":[["t","CompTIA Security+"]],"careful":null,"plain":[["t","Collect logs in one place, get alerted when something suspicious happens, and prove the alert fires by setting it off yourself."]],"why":[["t","Prevention fails eventually; detection is how you find out. An alert you have never seen fire is a hope, not a control. The test is simple: cause the bad thing on purpose and check the alert arrives where you will see it."]],"story":[["t","\"Tell me about a detection you built.\" The scan you ran in M1, caught by Suricata, visible in Grafana within seconds; the custom SSH alert you fired on purpose; and the week of tuning that cut the noise."]],"reps":[{"id":"M5-R1","text":[["t","Ship logs from every node and OPNsense to core (Monitoring \u0026 power chapter)"]],"doneWhen":[["t","one query returns logs from every source"]],"done":false,"proofs":[]},{"id":"M5-R2","text":[["t","Run Suricata in alert-only mode on the lab-facing interface, on the lab OPNsense now or the Phase 2 router later"]],"doneWhen":[["t","rules load and a test alert appears"]],"done":false,"proofs":[]},{"id":"M5-R3","text":[["t","Re-run the M1 scan"]],"doneWhen":[["t","the alert in Grafana matches the scan's timestamp"]],"done":false,"proofs":[]},{"id":"M5-R4","text":[["t","Write one detection of your own, such as an SSH login from outside the management range"]],"doneWhen":[["t","you trigger it on purpose and it reaches your phone or inbox"]],"done":false,"proofs":[]},{"id":"M5-R5","text":[["t","Tune for one week"]],"doneWhen":[["t","every suppressed alert has a written reason"]],"done":false,"proofs":[]},{"id":"M5-R6","text":[["t","Write an incident report for the scan with "],["a","the template","https://github.com/git-commit-duke/dukecodes-roadmap/blob/main/templates/incident-report.md"]],"doneWhen":[["t","it is merged"]],"done":false,"proofs":[]}],"breakIt":[[["t","Stop the log shipper on one node. Do you get an alert that its logs stopped? If not, build one: silence is a classic gap."]]],"concepts":[{"slug":"ids-vs-ips","q":[["t","Signature-based versus anomaly-based detection, and why start in alert-only mode?"]],"status":"todo","url":""},{"slug":"log-pipelines","q":[["t","From event to alert: where can logs be lost, delayed or forged?"]],"status":"todo","url":""},{"slug":"detection-engineering","q":[["t","What makes an alert actionable? True and false positives and negatives."]],"status":"todo","url":""}],"exit":[{"text":[["t","Logs from every source searchable in one place"]],"done":false},{"text":[["t","Suricata alert for your scan visible in Grafana"]],"done":false},{"text":[["t","One custom detection triggered on purpose and delivered to you"]],"done":false},{"text":[["t","Incident report merged"]],"done":false},{"text":[["t","Three concept explainers written and reviewed"]],"done":false},{"text":[["t","A ledger row for every proof"]],"done":false}],"progress":[0,12],"proofs":[]},{"id":"M6","num":6,"title":"Secure pipeline","status":"queued","phase":3,"url":"https://github.com/git-commit-duke/dukecodes-roadmap/blob/main/milestones/m6-secure-pipeline.md","build":[["t","Mission Control → Learning lab (Git hosting and CI with Forgejo on dev)"]],"chapters":["Learning lab"],"proof":[["t","A pipeline that blocks a pull request adding a known-vulnerable dependency, and a container image that is signed and ships with an SBOM anyone can verify"]],"cert":[["t","none"]],"careful":null,"plain":[["t","Make the build system check your code and its ingredients for known problems on every change, and stamp what it produces so nobody can swap it later."]],"why":[["t","Attackers increasingly skip your code and go after the build: a poisoned dependency, a leaked CI token, an image swapped after it was tested. A secure pipeline checks code, dependencies and configuration on every change, runs with as little access as possible, and signs what it builds so anyone can check where it came from."]],"story":[["t","\"How do you secure a CI/CD pipeline?\" A gate that blocked a real CVE before merge, images signed at build and verified at deploy, an SBOM for every build, and the pipeline's own attack surface (runner isolation, pinned actions, scoped tokens) reviewed like application code."]],"reps":[{"id":"M6-R1","text":[["t","Write a small FastAPI app with tests in "],["c","homelab-lab"],["t",", and pin one dependency to a version with a known CVE on purpose"]],"doneWhen":[["t","the app runs locally and you can name the CVE and what it allows"]],"done":false,"proofs":[]},{"id":"M6-R2","text":[["t","Run Forgejo Actions on a runner VM of its own, never with the host's Docker socket mounted"]],"doneWhen":[["t","an ADR says what a malicious job on that runner could still reach"]],"done":false,"proofs":[]},{"id":"M6-R3","text":[["t","Add gates that fail the build on high findings: Semgrep for code, Trivy for dependencies and the image, gitleaks for secrets"]],"doneWhen":[["t","the planted CVE fails the pipeline and the upgrade makes it pass"]],"done":false,"proofs":[]},{"id":"M6-R4","text":[["t","Generate an SBOM with Syft for every image"]],"doneWhen":[["t","you can answer \"do we ship library X, and which version?\" from the SBOM alone"]],"done":false,"proofs":[]},{"id":"M6-R5","text":[["t","Sign the image with cosign and verify the signature before every deploy"]],"doneWhen":[["t","an unsigned or modified image is refused"]],"done":false,"proofs":[]},{"id":"M6-R6","text":[["t","Harden the pipeline itself: actions pinned by commit SHA, tokens with the least access, zizmor on the workflow files"]],"doneWhen":[["t","zizmor reports nothing you have not explained in writing"]],"done":false,"proofs":[]},{"id":"M6-R7","text":[["t","Mirror the app to a public GitHub repo with the same gates"]],"doneWhen":[["t","its README shows the passing pipeline and links the SBOM"]],"done":false,"proofs":[]}],"breakIt":[[["t","Add a fake secret to CI, then open a pull request that tries to print it in the log. Masking should hide it. Then write down why masking alone is not a control."]],[["t","Change one byte of the image after signing and run the verification. It must fail."]],[["t","From a fork, open a pull request that edits the workflow. Your secrets must not be available to it."]]],"concepts":[{"slug":"sast-sca-dast","q":[["t","What does each kind of scan find, what does each miss, and where in the pipeline does it belong?"]],"status":"todo","url":""},{"slug":"sbom-and-signing","q":[["t","What does an SBOM prove, what does a signature prove, and what does neither prove?"]],"status":"todo","url":""},{"slug":"ci-supply-chain","q":[["t","Name three ways into a pipeline that never touch your code, and the control for each."]],"status":"todo","url":""}],"exit":[{"text":[["t","Pipeline blocks the planted vulnerable dependency and passes after the upgrade"]],"done":false},{"text":[["t","Every image has an SBOM and a signature verified before deploy"]],"done":false},{"text":[["t","Runner isolation ADR merged; zizmor clean or every finding explained"]],"done":false},{"text":[["t","Public mirror with passing gates"]],"done":false},{"text":[["t","Three concept explainers written and reviewed"]],"done":false},{"text":[["t","A ledger row for every proof"]],"done":false}],"progress":[0,13],"proofs":[]},{"id":"M7","num":7,"title":"Kubernetes security","status":"queued","phase":4,"url":"https://github.com/git-commit-duke/dukecodes-roadmap/blob/main/milestones/m7-kubernetes-security.md","build":[["t","Mission Control → Learning lab (Kubernetes with k3s on dev)"]],"chapters":["Learning lab"],"proof":[["t","A kube-bench report before and after hardening, admission policies that reject a privileged pod, and a Falco alert for a shell opened inside a container"]],"cert":[["t","CKA, then CKS"]],"careful":null,"plain":[["t","Run containers on a small Kubernetes cluster, set rules that refuse unsafe ones, and get an alert when someone opens a shell inside one."]],"why":[["t","Kubernetes runs many workloads on shared machines, so one badly configured pod can become a foothold on the node underneath. Security comes in layers: who may call the API (RBAC), what a pod may ask for (admission policy), which pods may talk to each other (network policy), and what to watch while it runs (runtime detection). Each layer assumes the one before it can fail."]],"story":[["t","\"How would you secure a Kubernetes cluster?\" Layers, each with proof: kube-bench numbers before and after, a privileged pod refused by policy, a default-deny network tested from inside the cluster, and a Falco alert for a shell you opened yourself."]],"reps":[{"id":"M7-R1","text":[["t","Install k3s on the dev node from the Learning lab chapter"]],"doneWhen":[["c","kubectl get nodes"],["t"," shows Ready and you can explain what each control-plane part does"]],"done":false,"proofs":[]},{"id":"M7-R2","text":[["t","Run kube-bench and save the report"]],"doneWhen":[["t","the baseline is in "],["c","evidence/"],["t"," and you have picked the five findings to fix first"]],"done":false,"proofs":[]},{"id":"M7-R3","text":[["t","Give each app its own namespace, service account and a Role with only what it needs"]],"doneWhen":[["c","kubectl auth can-i"],["t"," proves the account cannot read Secrets outside its namespace"]],"done":false,"proofs":[]},{"id":"M7-R4","text":[["t","Enforce Pod Security Admission at "],["c","restricted"],["t",", then add Kyverno policies: no privileged pods, no "],["c","latest"],["t"," tags, only images you signed in M6"]],"doneWhen":[["t","each bad pod is rejected with a clear message"]],"done":false,"proofs":[]},{"id":"M7-R5","text":[["t","Add a default-deny NetworkPolicy, then allow only the flows each app needs"]],"doneWhen":[["t","a test pod proves a blocked connection really fails"]],"done":false,"proofs":[]},{"id":"M7-R6","text":[["t","Run Falco and send its alerts into the M5 pipeline"]],"doneWhen":[["c","kubectl exec"],["t"," into a pod raises an alert you can see in Grafana"]],"done":false,"proofs":[]},{"id":"M7-R7","text":[["t","Re-run kube-bench"]],"doneWhen":[["t","a before/after table explains every remaining finding"]],"done":false,"proofs":[]}],"breakIt":[[["t","Try to deploy a privileged pod, a pod that mounts the host's filesystem, and a pod with an unsigned image. All three must be rejected."]],[["t","Check that the cluster's network plugin enforces NetworkPolicy before you rely on it. A policy that is accepted but not enforced is worse than none, because you think you are protected."]]],"concepts":[{"slug":"container-isolation","q":[["t","Namespaces and cgroups: what isolates a container, and why is a container not a virtual machine?"]],"status":"todo","url":""},{"slug":"kubernetes-rbac","q":[["t","Users, service accounts, Roles and bindings: how does the API server decide yes or no?"]],"status":"todo","url":""},{"slug":"admission-control","q":[["t","Where does an admission controller sit in a request, and what can it see and change?"]],"status":"todo","url":""}],"exit":[{"text":[["t","kube-bench before/after table with every remaining finding explained"]],"done":false},{"text":[["t","Privileged, "],["c","latest"],["t","-tagged and unsigned pods rejected by admission policy"]],"done":false},{"text":[["t","Default-deny NetworkPolicy tested, not assumed"]],"done":false},{"text":[["t","Falco alert for a shell in a container visible in Grafana"]],"done":false},{"text":[["t","Three concept explainers written and reviewed"]],"done":false},{"text":[["t","A ledger row for every proof"]],"done":false}],"progress":[0,13],"proofs":[]},{"id":"M8","num":8,"title":"Resilience \u0026 IR","status":"queued","phase":4,"url":"https://github.com/git-commit-duke/dukecodes-roadmap/blob/main/milestones/m8-resilience-and-ir.md","build":[["t","Mission Control → Backups · Maintenance \u0026 incidents"]],"chapters":["Backups","Maintenance \u0026 incidents"],"proof":[["t","A timed restore drill measured against written targets, an incident runbook, and a postmortem of an attack you simulated in the lab"]],"cert":[["t","none"]],"careful":[["t","Run attack simulations only on lab VMs you own, never on the home network."]],"plain":[["t","Prove you can get everything back after a disaster, and practise what to do if you get hacked, before it happens for real."]],"why":[["t","A backup you have never restored is a hope, not a control. Ransomware goes after backups first, so two questions matter: can an attacker on one machine delete the backups, and how long does a full recovery really take? Incident response works the same way: under stress you do what you have practised, so you practise."]],"story":[["t","\"Tell me about a time something went wrong.\" A restore drill with measured times against written targets, what you found when you checked whether the backup credential could delete backups, and a postmortem of a simulated attack mapped to ATT\u0026CK."]],"reps":[{"id":"M8-R1","text":[["t","Write an RPO/RTO table for each service: how much data you can afford to lose and how long it can be down"]],"doneWhen":[["t","every target has a reason, not only a number"]],"done":false,"proofs":[]},{"id":"M8-R2","text":[["t","Restore a VM from Proxmox Backup Server onto a different node and time it"]],"doneWhen":[["t","the measured time sits in the ledger next to its target"]],"done":false,"proofs":[]},{"id":"M8-R3","text":[["t","Restore from the second copy (the USB disk or the offsite copy) with the main backup server switched off"]],"doneWhen":[["t","the restore works without it"]],"done":false,"proofs":[]},{"id":"M8-R4","text":[["t","Check whether the backup credential on a node can delete or overwrite backups"]],"doneWhen":[["t","an ADR records the answer and, if yes, the fix"]],"done":false,"proofs":[]},{"id":"M8-R5","text":[["t","Write an incident runbook from the Maintenance \u0026 incidents chapter: detect, contain, eradicate, recover, learn"]],"doneWhen":[["t","someone else could follow it from page one"]],"done":false,"proofs":[]},{"id":"M8-R6","text":[["t","Run one Atomic Red Team test in the DevSec lab, then write a blameless postmortem with "],["a","the template","https://github.com/git-commit-duke/dukecodes-roadmap/blob/main/templates/incident-report.md"]],"doneWhen":[["t","it says whether M5 detected the test, how fast, and what you changed"]],"done":false,"proofs":[]}],"breakIt":[[["t","Tabletop: a node shows signs of compromise at 2 a.m. Walk the runbook out loud and time each decision."]],[["t","Delete a test file, then restore it from last night's backup. How far back could you really go?"]]],"concepts":[{"slug":"rpo-rto-and-3-2-1","q":[["t","What do RPO and RTO mean, and why does a 3-2-1 backup need one copy that is offline or cannot be changed?"]],"status":"todo","url":""},{"slug":"incident-lifecycle","q":[["t","Walk through detect, contain, eradicate, recover and learn. Which step do people skip, and what does that cost?"]],"status":"todo","url":""},{"slug":"mitre-attack","q":[["t","How does MITRE ATT\u0026CK describe an attack, and how do you use it to find gaps in your detections?"]],"status":"todo","url":""}],"exit":[{"text":[["t","RPO/RTO table merged with measured restore times"]],"done":false},{"text":[["t","Restore from the second copy proven without the main backup server"]],"done":false},{"text":[["t","Backup credential checked and an ADR merged"]],"done":false},{"text":[["t","Incident runbook and one postmortem merged"]],"done":false},{"text":[["t","Three concept explainers written and reviewed"]],"done":false},{"text":[["t","A ledger row for every proof"]],"done":false}],"progress":[0,12],"proofs":[]},{"id":"M9","num":9,"title":"Cloud mirror","status":"queued","phase":5,"url":"https://github.com/git-commit-duke/dukecodes-roadmap/blob/main/milestones/m9-cloud-mirror.md","build":[["t","Beyond Mission Control (an AWS account you create)"]],"chapters":[],"proof":[["t","A Terraform baseline for a new AWS account, a Prowler report before and after, and the M6 app deployed through a GitHub OIDC role with no stored keys"]],"cert":[["t","AWS Solutions Architect – Associate (AWS Security – Specialty later)"]],"careful":[["t","Cloud costs real money. Set the budget alarm before anything else, and tear everything down when you finish."]],"plain":[["t","Rebuild the same security habits in the cloud, where most of these jobs are, and prove the account is locked down with a scanner."]],"why":[["t","Most DevSecOps jobs run on a cloud provider. The ideas carry over from the lab (identity, segmentation, logging, least privilege), but the shared responsibility model moves the line: the provider secures the hardware and the platform, you secure everything you configure. Most cloud breaches are configuration mistakes, so you prove the configuration."]],"story":[["t","\"How would you secure a new AWS account?\" A Terraform baseline applied from CI, Prowler numbers before and after, a deploy role only your main branch can assume, and a bill that proves you cleaned up."]],"reps":[{"id":"M9-R1","text":[["t","Create an AWS account and lock the root user: MFA on, no access keys, a budget alarm set low"]],"doneWhen":[["t","root is for emergencies only and the alarm has emailed you once as a test"]],"done":false,"proofs":[]},{"id":"M9-R2","text":[["t","Set up IAM Identity Center for your daily login"]],"doneWhen":[["t","day-to-day work uses neither root nor a long-lived access key"]],"done":false,"proofs":[]},{"id":"M9-R3","text":[["t","Write Terraform for the baseline in "],["c","homelab-cloud"],["t",": CloudTrail in every region, account-level S3 Block Public Access, and a GitHub OIDC role for deploys"]],"doneWhen":[["c","terraform plan"],["t"," is clean and CI applies it"]],"done":false,"proofs":[]},{"id":"M9-R4","text":[["t","Run Prowler before and after the baseline"]],"doneWhen":[["t","a before/after table explains every remaining high finding"]],"done":false,"proofs":[]},{"id":"M9-R5","text":[["t","Deploy the signed M6 image through the OIDC role"]],"doneWhen":[["t","the pipeline runs with no AWS keys stored anywhere"]],"done":false,"proofs":[]},{"id":"M9-R6","text":[["t","Tear it all down and check the bill"]],"doneWhen":[["c","terraform destroy"],["t"," is clean and the cost is in the ledger"]],"done":false,"proofs":[]}],"breakIt":[[["t","Try to make an S3 bucket public. Block Public Access must refuse."]],[["t","Try to assume the deploy role from another repo or branch. The role's trust policy must refuse."]]],"concepts":[{"slug":"shared-responsibility","q":[["t","What does AWS secure, what do you secure, and where do people draw the line wrong?"]],"status":"todo","url":""},{"slug":"iam-policy-evaluation","q":[["t","When several policies apply, how does AWS decide allow or deny?"]],"status":"todo","url":""},{"slug":"oidc-federation","q":[["t","How does a CI job get cloud access without a stored key, and what stops another repo doing the same?"]],"status":"todo","url":""}],"exit":[{"text":[["t","Root locked, Identity Center in daily use, budget alarm tested"]],"done":false},{"text":[["t","Baseline applied from CI with Terraform"]],"done":false},{"text":[["t","Prowler before/after table with every remaining high finding explained"]],"done":false},{"text":[["t","M6 image deployed through OIDC with no stored keys, then torn down"]],"done":false},{"text":[["t","Three concept explainers written and reviewed"]],"done":false},{"text":[["t","A ledger row for every proof"]],"done":false}],"progress":[0,12],"proofs":[]}],"ledger":[],"skills":[{"name":"Git: branches, pull requests, signed commits","domain":"Foundations","milestone":"M0","score":null,"evidence":[]},{"name":"Threat modeling with STRIDE","domain":"Foundations","milestone":"M0","score":null,"evidence":[]},{"name":"Writing decision records (ADRs)","domain":"Communication","milestone":"M0","score":null,"evidence":[]},{"name":"Explaining a concept from first principles","domain":"Communication","milestone":"M0","score":null,"evidence":[]},{"name":"Subnets, routing and TCP/IP","domain":"Networking","milestone":"M1","score":null,"evidence":[]},{"name":"VLANs and firewall rules","domain":"Networking","milestone":"M1","score":null,"evidence":[]},{"name":"DNS","domain":"Networking","milestone":"M1","score":null,"evidence":[]},{"name":"Network scanning with nmap","domain":"Networking","milestone":"M1","score":null,"evidence":[]},{"name":"Packet capture with tcpdump or Wireshark","domain":"Networking","milestone":"M1","score":null,"evidence":[]},{"name":"Linux command line and Bash","domain":"Linux","milestone":"M2","score":null,"evidence":[]},{"name":"Linux hardening: SSH, users, sudo, services","dom   async function runConsole(g, body, name, left, right) {
    const alive = () => g === gen;
    const row = (ic, cls, nm, ds, extra) => {
      const a = h("span", { class: "ic " + cls }, ic), c = h("span", { class: "ds" }, ds);
      body.append(h("div", { class: extra ? "row " + extra : "row" }, a, h("span", { class: "nm" }, nm), c));
      return { a, c };
    };
    const s = D.stats, n = D.checks.length;
    for (let loop = 0; alive(); loop++) {
      body.replaceChildren();
      const t0 = performance.now();
      const clock = () => { right.textContent = ((performance.now() - t0) / 1000).toFixed(1) + "s"; };
      left.textContent = "";
      right.textContent = "";
      if (loop % 2 === 0) {
        name.textContent = "roadmap check · replay of the last build";
        row("$", "", "uv run roadmap check", "", "cmdrow");
        let k = 0;
        for (const [nm, ds] of D.checks) {
          const x = row("◐", "run spin", nm, "checking…");
          await sleep(140 + Math.random() * 220);
          if (!alive()) return;
          x.a.className = "ic ok";
          x.a.textContent = "✓";
          x.c.textContent = ds;
          left.textContent = `${++k}/${n} checks`;
          clock();
        }
        row("→", "ok", "exit 0", `ok · ${D.milestones.length} milestones · ${s.reps[1]} reps · ${s.proofs} proofs`, "rm-gap");
      } else {
        name.textContent = "roadmap status · replay of the last build";
        row("$", "", "uv run roadmap status", "", "cmdrow");
        for (const [ic, cls, nm, ds] of statusRows()) {
          await sleep(320);
          if (!alive()) return;
          row(ic, cls, nm, ds);
          clock();
        }
        left.textContent = "exit 0";
      }
      if (calm) return;
      await sleep(4200);
    }
  }

  /* ---------- gate simulator ---------- */
  function simEl() {
    const sim = D.simulator, g = gen;
    let run = 0;
    const scn = sim.scenarios.map((s, i) => h("button", { class: "scn", type: "button", "aria-pressed": "false", on: { click: () => play(i) } },
      h("span", { class: "pl", "aria-hidden": "true" }, s.icon || "▶"),
      h("span", null, h("b", null, s.title), h("small", null, rich(s.summary, true)))));
    const pkt = h("div", { class: "pkt" });
    const gates = sim.gates.map((x) => h("div", { class: "gate" }, h("div", { class: "gw" }, x.where), h("div", { class: "gn" }, x.name),
      h("div", { class: "bar" }, h("i")), h("div", { class: "gs" }, "idle")));
    const lane = h("div", { class: "lane", vars: { "--n": sim.gates.length } }, h("div", { class: "track" }), pkt, gates);
    const local = sim.gates.filter((x) => x.zone === "local").length;
    const zone = h("div", { class: "zone", "aria-hidden": "true" },
      h("span", { vars: { "--w": local } }, "◂ my laptop (pre-commit) ▸"),
      h("span", { vars: { "--w": sim.gates.length - local } }, "◂ GitHub (CI on every push) ▸"));
    const log = h("div", { class: "log", "aria-label": "Simulated output" });
    const verdict = h("div", { class: "verdict", role: "status" });
    const stats = h("div", { class: "sim-stats" });
    const wrap = h("div", { class: "sim", id: "sim" },
      h("div", { class: "panel sim-l", role: "group", "aria-label": "Pick a change" }, scn),
      h("div", { class: "panel sim-r" }, lane, zone, log, verdict, stats));

    const barOf = (el) => $(".bar i", el), statusOf = (el) => $(".gs", el);
    const line = (cls, txt) => {
      log.append(h("div", { class: cls }, txt));
      log.scrollTop = log.scrollHeight;
    };
    function movePkt(el) {
      const lr = lane.getBoundingClientRect(), r = el.getBoundingClientRect();
      if (lr.width) pkt.style.left = ((r.left + r.width / 2 - lr.left) / lr.width) * 100 + "%";
    }

    async function play(i, auto = false) {
      const id = ++run, s = sim.scenarios[i];
      const alive = () => id === run && g === gen;
      scn.forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
      log.replaceChildren();
      verdict.replaceChildren();
      for (const el of gates) {
        el.className = "gate";
        barOf(el).style.width = "0%";
        statusOf(el).textContent = "idle";
      }
      pkt.className = "pkt on";
      pkt.style.left = "0%";
      const t0 = performance.now(), skip = new Set(s.skip || []);
      let passed = 0;
      const stat = () => stats.replaceChildren(
        h("span", null, "gates passed ", h("b", null, `${passed}/${sim.gates.length}`)),
        h("span", null, "elapsed ", h("b", null, ((performance.now() - t0) / 1000).toFixed(1) + "s")),
        h("span", null, "simulated: nothing is committed"));
      line("dim", "$ " + s.cmd);
      stat();
      for (let k = 0; k < sim.gates.length; k++) {
        if (!alive()) return;
        const gd = sim.gates[k], el = gates[k];
        movePkt(el);
        if (skip.has(gd.id)) {
          el.classList.add("skip");
          statusOf(el).textContent = "⇥ skipped";
          line("dim", `[${gd.name}] skipped: hooks bypassed with --no-verify`);
          await sleep(300);
          continue;
        }
        el.classList.add("scan");
        statusOf(el).textContent = "scanning…";
        line("warn", `[${gd.name}] ${gd.doing}…`);
        for (let p = 0; p <= 100; p += 20) {
          if (!alive()) return;
          barOf(el).style.width = p + "%";
          stat();
          await sleep(110);
        }
        el.classList.remove("scan");
        if (s.blockAt === gd.id) {
          el.classList.add("block");
          statusOf(el).textContent = "✕ blocked";
          pkt.classList.add("bad");
          line("bad", `[${gd.name}] ✕ ${s.finding}`);
          line("dim", "exit 1 · the change never reaches main");
          for (const x of gates.slice(k + 1)) {
            x.classList.add("skip");
            statusOf(x).textContent = "not reached";
          }
          verdict.replaceChildren(h("div", { class: "callout warn" }, h("b", null, `Blocked at ${gd.name}. `), rich(s.lesson)));
          glossify(verdict, new Set());
          stat();
          return;
        }
        el.classList.add("pass");
        statusOf(el).textContent = "✓ pass";
        passed++;
        line("ok", `[${gd.name}] ✓ ${(s.pass && s.pass[gd.id]) || gd.ok}`);
        stat();
        await sleep(160);
      }
      if (!alive()) return;
      pkt.classList.add("ok");
      line("ok", "✓ every gate green · ready to merge");
      verdict.replaceChildren(h("div", { class: "callout tip" }, h("b", null, "Merged. "), rich(s.lesson)));
      glossify(verdict, new Set());
      if (!auto) confetti();
    }

    simPlay = play;
    after.push(() => {
      if (!("IntersectionObserver" in window)) return;
      const seen = new IntersectionObserver((es) => {
        if (!es.some((e) => e.isIntersecting)) return;
        seen.disconnect();
        if (g === gen && run === 0) play(0, true);
      }, { threshold: 0.35 });
      seen.observe(wrap);
    });
    return wrap;
  }

      pause();
      left = 120;
      fmt();

    const items = () => (st.stories ? [...pool, ...D.milestones.map((m) => ({ m, story: true }))] : pool);
    function back(it) {
      if (it.story) return plain(it.m.story);
