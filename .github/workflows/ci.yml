name: ci
# Every gate the page's pipeline simulator describes. tests/test_policy.py checks that each
# gate in showcase.toml is backed by a line here or in .pre-commit-config.yaml.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Release cooldown for uvx tools (uvx ignores pyproject.toml); keep equal to the Makefile COOLDOWN.
  UV_EXCLUDE_NEWER: "7 days"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: hooks (pre-commit, zizmor online)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
      # no-commit-to-branch would fail every push to main; roadmap-build runs in the test job.
      - name: pre-commit hooks on every file
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,roadmap-build
      - name: zizmor online audits (impostor commits, known-vulnerable actions)
        run: uvx zizmor@1.31.1 --format=github .
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: types, tests, roadmap check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
      - name: install from the lock (fails if uv.lock is out of date)
        run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest --cov
      - name: every tick has proof, no private addresses, links resolve
        run: uv run --frozen roadmap check
      - name: page data and scoreboard match the files
        run: uv run --frozen roadmap build --check
      - name: page scripts parse
        run: node --check site/theme.js && node --check site/app.js

  history:
    name: secrets in every commit (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
      # The pre-commit hook only sees staged files. This scans the whole history,
      # so a commit made with --no-verify is still caught.
      - run: uvx pre-commit@4.7.0 run gitleaks-history --hook-stage manual --all-files

  scan:
    name: code and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
      - run: bash scripts/scan.sh
