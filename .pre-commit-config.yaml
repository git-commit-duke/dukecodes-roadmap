# Every rev is pinned and was at least 7 days old when adopted. To bump: `make update-hooks`,
# check each new release is 7 days old, review the diff, commit. CI runs these same hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Staged files on every commit.
      - id: gitleaks
      # Every commit in history. CI runs it: `pre-commit run gitleaks-history --hook-stage manual`.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (whole history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-d, relaxed]
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--offline]
  - repo: local
    hooks:
      # Fails the commit if a tick has no proof or something private slipped in, and rebuilds the
      # page and README scoreboard. If it rewrites them, `git add` the result and commit again.
      - id: roadmap-build
        name: roadmap check + build
        entry: uv run --frozen roadmap build
        language: system
        pass_filenames: false
        always_run: true
